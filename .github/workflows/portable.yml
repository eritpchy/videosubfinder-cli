name: Portable CLI
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portable-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release series and version sources
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python3 scripts/check-version.py --tag "$GITHUB_REF_NAME"
          else
            python3 scripts/check-version.py
          fi
  fixtures:
    needs: version
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate shared fixture videos
        run: |
          if ! command -v ffmpeg >/dev/null || [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]; then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
            sudo apt-get install -y ffmpeg fonts-dejavu-core
          fi
          mkdir test-media
          python3 -c "import sys; from pathlib import Path; sys.path.insert(0, 'tests'); from test_cli import fixtures; fixtures(Path('test-media').resolve())"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-media
          path: test-media/*
          if-no-files-found: error
  linux:
    needs: fixtures
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      VSF_ARCH: ${{ matrix.arch }}
      VSF_TEST_MEDIA: ${{ github.workspace }}/test-media
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-media
          path: test-media
      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y file desktop-file-utils
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            build/static-prefix
            build/sources
            build/opencv-static
          key: musl-${{ matrix.arch }}-${{ hashFiles('scripts/build-static-linux.sh') }}
      - name: Build and test static bundle
        run: |
          docker run --rm -e VSF_TEST_MEDIA=/src/test-media -v "$PWD:/src" -w /src alpine:3.22 sh -c '
            apk add --no-cache build-base cmake meson ninja linux-headers git curl python3 nasm pkgconf binutils patchelf
            sh scripts/build-static-linux.sh'
          sudo chown -R "$(id -u):$(id -g)" build dist-static
          mv dist-static dist
          python3 scripts/check-binary.py dist/VideoSubFinderCli "$VSF_ARCH"
      - name: Build and test AppImage
        run: sh scripts/appimage.sh
      - name: Archive portable bundle and fixture videos
        run: |
          tar -C dist -czf videosubfinder-cli-linux-${{ matrix.arch }}.tar.gz .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages-${{ matrix.arch }}
          path: |
            videosubfinder-cli-linux-${{ matrix.arch }}.tar.gz
            videosubfinder-cli-linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error
  worker-linux:
    needs: fixtures
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            ubuntu: '20.04'
          - runner: ubuntu-24.04
            arch: x64
            ubuntu: '22.04'
          - runner: ubuntu-24.04
            arch: x64
            ubuntu: '24.04'
          - runner: ubuntu-24.04-arm
            arch: arm64
            ubuntu: '20.04'
          - runner: ubuntu-24.04-arm
            arch: arm64
            ubuntu: '22.04'
          - runner: ubuntu-24.04-arm
            arch: arm64
            ubuntu: '24.04'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-media
          path: test-media
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            build/sources/opencv
            build/dynamic-ubuntu${{ matrix.ubuntu }}
          key: worker-${{ matrix.ubuntu }}-${{ matrix.arch }}-${{ hashFiles('scripts/build-dynamic-linux.sh', 'scripts/bundle-worker.py') }}
      - name: Build worker CLI against system FFmpeg
        env:
          WORKER_UBUNTU: ${{ matrix.ubuntu }}
        run: |
          docker run --rm -e VSF_TEST_MEDIA=/src/test-media -v "$PWD:/src" -w /src "ubuntu:$WORKER_UBUNTU" sh -c '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends g++ ninja-build python3-pip curl ca-certificates libavcodec-dev libavformat-dev libavutil-dev libswscale-dev pkg-config patchelf nasm
            python3 -m pip install --break-system-packages cmake==3.31.6 2>/dev/null || python3 -m pip install cmake==3.31.6
            sh scripts/build-dynamic-linux.sh'
          sudo chown -R "$(id -u):$(id -g)" build dist-dynamic
      - name: Test on a clean FFmpeg runtime image
        env:
          TEST_IMAGE: ubuntu:${{ matrix.ubuntu }}
        run: sh scripts/test-worker.sh
      - name: Archive worker package
        run: tar -C dist-dynamic -czf videosubfinder-cli-linux-dynamic-ubuntu${{ matrix.ubuntu }}-${{ matrix.arch }}.tar.gz .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-packages-${{ matrix.ubuntu }}-${{ matrix.arch }}
          path: videosubfinder-cli-linux-dynamic-ubuntu${{ matrix.ubuntu }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
  linux-distros:
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:16.04
          - ubuntu:18.04
          - ubuntu:20.04
          - ubuntu:22.04
          - ubuntu:24.04
          - ubuntu:26.04
          - debian:buster-slim
          - debian:bullseye-slim
          - debian:bookworm-slim
          - debian:trixie-slim
          - centos:7
          - almalinux:8
          - almalinux:9
          - almalinux:10
          - rockylinux:8
          - rockylinux:9
          - fedora:42
          - fedora:43
          - fedora:44
          - opensuse/leap:15.6
          - opensuse/leap:16.0
          - opensuse/tumbleweed:latest
          - archlinux:base
          - alpine:3.15
          - alpine:3.18
          - alpine:3.22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages-x64
          path: packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-media*
          path: test-media
          merge-multiple: true
      - name: Test without host multimedia libraries or FUSE
        env:
          TEST_IMAGE: ${{ matrix.image }}
        run: |
          mkdir bundle
          tar -C bundle -xzf packages/videosubfinder-cli-linux-x64.tar.gz
          chmod +x packages/*.AppImage
          sh scripts/test-distro.sh
  linux-arm64:
    needs: linux
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:16.04', 'ubuntu:18.04', 'ubuntu:20.04', 'ubuntu:22.04', 'ubuntu:24.04', 'ubuntu:26.04', 'debian:buster-slim', 'debian:bullseye-slim', 'debian:bookworm-slim', 'debian:trixie-slim', 'almalinux:8', 'almalinux:9', 'fedora:43', 'alpine:3.18', 'alpine:3.22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages-arm64
          path: packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-media*
          path: test-media
          merge-multiple: true
      - env:
          TEST_IMAGE: ${{ matrix.image }}
          VSF_ARCH: arm64
        run: |
          mkdir bundle
          tar -C bundle -xzf packages/videosubfinder-cli-linux-arm64.tar.gz
          chmod +x packages/*.AppImage
          sh scripts/test-distro.sh
  windows:
    needs: fixtures
    name: Windows (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x64
            platform: x64
            vs-component: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          - runner: windows-11-arm
            arch: arm64
            platform: ARM64
            vs-component: Microsoft.VisualStudio.Component.VC.Tools.ARM64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.arch }}-windows-static
      VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.arch }}-windows
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
      VSF_TEST_MEDIA: ${{ github.workspace }}/test-media
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-media
          path: test-media
      - name: Identify Windows toolchain for dependency caching
        id: windows-toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $visualStudio = & $vswhere -latest -products '*' -version '[17.0,19.0)' -requires '${{ matrix.vs-component }}' -property installationVersion
          if ($LASTEXITCODE -or !$visualStudio -or !$env:ImageVersion) { throw 'Cannot identify the Windows build toolchain' }
          $major = [int]($visualStudio -split '\.')[0]
          $generator = switch ($major) {
            17 { 'Visual Studio 17 2022' }
            18 { 'Visual Studio 18 2026' }
            default { throw "Unsupported Visual Studio version: $visualStudio" }
          }
          Write-Host "Using Visual Studio $visualStudio ($generator)"
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT
          "visual-studio=$visualStudio" >> $env:GITHUB_OUTPUT
          "generator=$generator" >> $env:GITHUB_OUTPUT
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: vcpkg-cache
        with:
          path: |
            .vcpkg-cache
            build/vcpkg_installed
          key: windows-static-release-v4-${{ matrix.arch }}-${{ steps.windows-toolchain.outputs.image }}-${{ steps.windows-toolchain.outputs.visual-studio }}-${{ hashFiles('vcpkg.json', 'triplets/*.cmake') }}
          restore-keys: |
            windows-static-release-v4-${{ matrix.arch }}-${{ steps.windows-toolchain.outputs.image }}-${{ steps.windows-toolchain.outputs.visual-studio }}-
      - name: Synchronize pinned vcpkg baseline
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          git -C "$env:VCPKG_INSTALLATION_ROOT" fetch origin $baseline --depth 1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git -C "$env:VCPKG_INSTALLATION_ROOT" checkout --detach $baseline
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:VCPKG_INSTALLATION_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Configure static Windows dependencies
        id: configure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
          cmake -S . -B build -G "${{ steps.windows-toolchain.outputs.generator }}" -A ${{ matrix.platform }} -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=${{ matrix.arch }}-windows-static -DVCPKG_OVERLAY_TRIPLETS="$pwd/triplets" -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: steps.vcpkg-cache.outputs.cache-hit != 'true' && steps.configure.outcome == 'success'
        with:
          path: |
            .vcpkg-cache
            build/vcpkg_installed
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Build static Windows CLI binary
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --install build --config Release --prefix "$pwd/dist"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test relocated Windows CLI binary
        shell: pwsh
        run: |
          python scripts/check-binary.py "$pwd/dist/VideoSubFinderCli.exe" ${{ matrix.arch }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/test_cli.py "$pwd/dist/VideoSubFinderCli.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/* -DestinationPath videosubfinder-cli-windows-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-package-${{ matrix.arch }}
          path: videosubfinder-cli-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
  macos:
    needs: fixtures
    env:
      VSF_TEST_MEDIA: ${{ github.workspace }}/test-media
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-media
          path: test-media
      - name: Install dependencies
        run: brew install opencv@4
      - name: Build and test portable CLI
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/dist" -DOpenCV_DIR="$(brew --prefix opencv@4)/lib/cmake/opencv4"
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure
          cmake --install build
          python3 scripts/bundle.py dist
          python3 tests/test_cli.py "$PWD/dist/VideoSubFinderCli.run"
          tar -C dist -czf videosubfinder-cli-macos-${{ matrix.arch }}.tar.gz .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-packages-${{ matrix.arch }}
          path: videosubfinder-cli-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
  universal:
    env:
      VSF_TEST_MEDIA: ${{ github.workspace }}/test-media
    needs: macos
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: macos-packages-*
          merge-multiple: true
          path: packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-media
          path: test-media
      - run: |
          mkdir x64 arm64
          tar -C x64 -xzf packages/videosubfinder-cli-macos-x64.tar.gz
          tar -C arm64 -xzf packages/videosubfinder-cli-macos-arm64.tar.gz
          python3 scripts/universal.py x64 arm64 dist
          python3 tests/test_cli.py "$PWD/dist/VideoSubFinderCli.run"
          VSF_EXEC_PREFIX='/usr/bin/arch -x86_64' python3 tests/test_cli.py "$PWD/dist/VideoSubFinderCli"
          tar -C dist -czf videosubfinder-cli-macos-universal.tar.gz .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: universal-package
          path: videosubfinder-cli-macos-universal.tar.gz
          if-no-files-found: error
  sanitizers:
    needs: fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VSF_TEST_MEDIA: ${{ github.workspace }}/test-media
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-media
          path: test-media
      - name: Install sanitizer build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends libopencv-dev ninja-build
      - name: Build with ASan and UBSan
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DVSF_SANITIZERS=ON
          cmake --build build --parallel 2
      - name: Run extraction and CCTI regressions with ASan and UBSan
        run: ctest --test-dir build --output-on-failure
  cuda:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container: nvidia/cuda:12.6.3-devel-ubuntu22.04
    steps:
      - name: Bootstrap source checkout
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y git ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Build minimal media dependencies and CUDA CLI
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y g++ make ninja-build pkg-config nasm curl python3-pip ffmpeg fonts-dejavu-core patchelf
          python3 -m pip install cmake==3.31.6 meson==1.7.2
          python3 tests/test_cuda_package.py
          sh scripts/build-cuda-linux.sh
      - name: Package and audit CUDA 12 CLI
        run: |
          tar -C dist-cuda -czf videosubfinder-cli-linux-cuda12-x64.tar.gz .
          python3 scripts/check-cuda-package.py dist-cuda videosubfinder-cli-linux-cuda12-x64.tar.gz > cuda-package-report.json
          cat cuda-package-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cuda12-package
          path: videosubfinder-cli-linux-cuda12-x64.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cuda12-size-report
          path: cuda-package-report.json
          if-no-files-found: error
  source:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - run: python3 scripts/source-package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-package
          path: videosubfinder-cli-source.tar.gz
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-distros, linux-arm64, worker-linux, windows, universal, sanitizers, cuda, source]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*package*'
          path: packages
          merge-multiple: true
      - name: Publish tested assets with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd packages
          sha256sum *.tar.gz *.zip *.AppImage > SHA256SUMS
          default_version=$(gh api "repos/$GH_REPO/contents/Interfaces/VideoSubFinderWXW/MyResource.h?ref=main" --jq .content | python3 -c 'import base64,re,sys; print(re.search(r"#define\s+VSF_VERSION\s+\"([0-9.]+)\"",base64.b64decode(sys.stdin.read()).decode()).group(1))')
          latest=false
          if [ "$RELEASE_TAG" = "v$default_version" ]; then latest=true; fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --clobber ./*
            gh release edit "$RELEASE_TAG" --verify-tag --draft=false --latest="$latest" --title "$RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --latest="$latest" --title "$RELEASE_TAG" ./*
          fi
